# 2026-10-02 — nginx : frontend compilé + relais /api/ -> 127.0.0.1:8103 (CORS vide)
server {
    listen 443 ssl;
    server_name rating.example.com;     # À ADAPTER

    ssl_certificate     /etc/ssl/certs/rating.pem;
    ssl_certificate_key /etc/ssl/private/rating.key;

    root /srv/rating/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8103;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / { try_files $uri $uri/ /index.html; }
}
